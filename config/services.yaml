services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  WEM\GeoDataBundle\:
    resource: ../src/
    exclude: ../src/{ContaoManager,DependencyInjection,Module}

  wem.geodata.service.google_maps:
    class: WEM\GeoDataBundle\Service\GoogleMaps

  wem.geodata.service.leaflet:
