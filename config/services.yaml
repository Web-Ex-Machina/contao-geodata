      $connection: '@database_connection'
    tags:
      - { name: contao.migration, priority: 0 }

  WEM\GeoDataBundle\Migration\M202307181508_DefaultMapCategory:
    arguments:
      $connection: '@database_connection'
    tags:
      - { name: contao.migration, priority: 0 }

  WEM\GeoDataBundle\Migration\M202410251433_EncodeMapProviderGmapKey:
    arguments:
      $connection: '@database_connection'
